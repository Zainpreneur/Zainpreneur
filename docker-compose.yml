services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zainpreneur
      POSTGRES_PASSWORD: zainpreneur_dev
      POSTGRES_DB: zainpreneur
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zainpreneur"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zainpreneur:zainpreneur_dev@postgres:5432/zainpreneur
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars!!!}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5900
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
