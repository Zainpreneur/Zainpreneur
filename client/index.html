<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zainpreneur Business Portfolio</title>
    <meta name="description" content="An internal business portfolio and operations platform." />
    <meta name="theme-color" content="#fbfaf7" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script>
      // Restore the theme before first paint. After paint the page would draw a
      // light ground and then snap to dark a frame later.
      (function () {
        try {
          var t = localStorage.getItem("zp-theme");
          if (!t || t === "system") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
